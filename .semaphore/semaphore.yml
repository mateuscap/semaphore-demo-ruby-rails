version: v1.0
name: Demo Rails 6 app
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: Setup
    dependencies: []
    task:
      jobs:
        - name: bundle
          commands:
            - sem-version ruby 2.7.3
            - sem-version node 14.16.1
            - checkout
            - cache restore
            - bundle install
            - cache store
  - name: Code scanning
    dependencies:
      - Setup
    task:
      jobs:
        - name: check style + security
          commands:
            - sem-version ruby 2.7.3
            - sem-version node 14.16.1
            - checkout
            - cache restore
            - bundle install
            - cache store
            - bundle exec rubocop
            - bundle exec brakeman
  - name: Unit tests - Ubuntu 22
    dependencies:
      - Code scanning
    task:
      prologue:
        commands:
          - sem-version ruby 2.7.3
          - sem-version node 14.16.1
          - checkout
          - cache restore
          - bundle install
          - cache store
          - sem-service start postgres
          - 'bundle exec rake db:setup'
      jobs:
        - name: RSpec - model tests
          commands:
            - bundle exec rspec spec/models
        - name: RSpec - controller tests
          commands:
            - bundle exec rspec spec/controllers
      epilogue:
        always:
          commands:
            - "[[ -f junit.xml ]] && test-results publish --name \"\U0001F9EA Unit tests\" junit.xml"
    skip:
      when: branch = 'clean'
  - name: Integration tests - Ubuntu 22
    dependencies:
      - Unit tests - Ubuntu 22
    task:
      prologue:
        commands:
          - sem-version ruby 2.7.3
          - sem-version node 14.16.1
          - checkout
          - cache restore
          - bundle install
          - cache store
      jobs:
        - name: RSpec - feature specs
          commands:
            - sem-service start postgres
            - 'bundle exec rake db:setup'
            - bundle exec rspec spec/features
      epilogue:
        always:
          commands:
            - "[[ -f junit.xml ]] && test-results publish --name \"\U0001F3D7️ Integration tests\" junit.xml"
    skip:
      when: branch = 'clean'
  - name: Unit tests - Ubuntu 24
    dependencies:
      - Code scanning
    task:
      prologue:
        commands:
          - sem-version ruby 2.7.3
          - sem-version node 14.16.1
          - checkout
          - cache restore
          - bundle install
          - cache store
          - sem-service start postgres
          - 'bundle exec rake db:setup'
      jobs:
        - name: RSpec - model tests
          commands:
            - bundle exec rspec spec/models
            - cp junit.xml junit-2.xml
            - artifact push workflow junit-2.xml
        - name: RSpec - controller tests
          commands:
            - bundle exec rspec spec/controllers
            - cp junit.xml junit-3.xml
            - artifact push workflow junit-3.xml
      epilogue:
        always:
          commands:
            - "## test-results publish --name \"\U0001F9EA Unit tests\" junit.xml junit-2.xml"
            - "## [[ -f junit.xml ]] && test-results publish --name \"\U0001F9EA Unit tests\" junit.xml"
  - name: Integration tests - Ubuntu 24
    dependencies:
      - Unit tests - Ubuntu 24
    task:
      prologue:
        commands:
          - sem-version ruby 2.7.3
          - sem-version node 14.16.1
          - checkout
          - cache restore
          - bundle install
          - cache store
      jobs:
        - name: RSpec - feature specs
          commands:
            - sem-service start postgres
            - 'bundle exec rake db:setup'
            - bundle exec rspec spec/features
            - 'artifact pull workflow junit-2.xml '
            - artifact pull workflow junit-3.xml
      epilogue:
        always:
          commands:
            - "[[ -f junit.xml ]] && test-results publish --name \"\U0001F3D7️ Integration tests\" junit.xml"
            - "[[ -f junit-2.xml ]] && test-results publish --name \"\U0001F9EA Unit tests\" junit-2.xml junit-3.xml"
after_pipeline:
  task:
    jobs:
      - name: Publish Results
        commands:
          - test-results gen-pipeline-report
